version: "1.0"

workflow:
  name: docker_api_validation
  description: >
    Read-only validation of exposed Docker APIs identified during recon.
    No container creation. No mutation.

  tasks:
    - id: check_version
      type: http_request
      description: Get Docker API version
      method: GET
      path: "/version"
      expect_status: 200

    - id: list_containers
      type: http_request
      description: List running containers
      method: GET
      path: "/containers/json"
      expect_status: 200

    - id: inspect_info
      type: http_request
      description: Get Docker daemon info
      method: GET
      path: "/info"
      expect_status: 200

safety:
  mode: read_only
  allow_mutation: false
  allow_exec: false