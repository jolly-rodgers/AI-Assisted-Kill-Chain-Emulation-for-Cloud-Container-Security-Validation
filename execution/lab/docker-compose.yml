version: "3.9"

services:
  vulnerable-docker:
    image: docker:24-dind
    container_name: vulnerable-docker-daemon
    privileged: true
    restart: unless-stopped
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    ports:
      - "2375:2375"
    networks:
      - lab_net

networks:
  lab_net:
    driver: bridge
